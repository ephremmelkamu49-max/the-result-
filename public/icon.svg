<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>
  
  <!-- Ambient glow backdrop -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.22" filter="url(#glow)"/>

  <!-- Film Reel / Clapperboard Core -->
  <g transform="translate(256, 240)">
    <!-- Outer Reel Ring -->
    <circle r="120" fill="none" stroke="url(#accentGrad)" stroke-width="14"/>
    
    <!-- Film Perforations / Spoke Accents -->
    <circle cx="0" cy="-76" r="16" fill="#6366f1"/>
    <circle cx="76" cy="0" r="16" fill="#8b5cf6"/>
    <circle cx="0" cy="76" r="16" fill="#ec4899"/>
    <circle cx="-76" cy="0" r="16" fill="#a855f7"/>

    <!-- Inner Core Play / Magic Triangle -->
    <path d="M -24 -46 L 50 0 L -24 46 Z" fill="#ffffff" rx="6"/>
  </g>

  <!-- Bottom Script Sparkle Badge -->
  <g transform="translate(256, 420)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#e4e4e7" letter-spacing="2">SCRIPTREEL</text>
  </g>
</svg>
